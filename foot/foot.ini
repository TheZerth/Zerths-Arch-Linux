# Lapis Obscura foot theme
# Dark basalt terminal with Gruvbox mineral accents.

[main]
font=ProggyCleanTT:pixelsize=16
selection-target=both
pad=8x8
term=xterm-256color

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0
background=050408
foreground=c8c8d0
cursor=050408 d8a657

# Normal colors: stone, rust, moss, gold, spirit, portal, ritual, moon
regular0=090812
regular1=cc241d
regular2=98971a
regular3=d8a657
regular4=83a598
regular5=d3869b
regular6=8ec07c
regular7=c8c8d0

# Bright colors: ash, ember, lichen, lantern, signal, arcane, aqua, bone
bright0=55515d
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=8f7dff
bright6=8ec07c
bright7=e4e0e8

# Stone selection and URL markers
selection-foreground=e4e0e8
selection-background=171522
jump-labels=050408 fabd2f
urls=83a598

[csd]
preferred=none
