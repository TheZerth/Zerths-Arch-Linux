# Lapis Obscura fuzzel theme
# Command portal, not app-store card: sharp stone, small footprint, sparse sigils.

[main]
font=ProggyCleanTT:pixelsize=16
terminal=foot -e
prompt="◇ "
placeholder="summon command"
icons-enabled=no
use-bold=no
dpi-aware=no
width=55
lines=13
horizontal-pad=13
vertical-pad=8
inner-pad=5
tabs=4
layer=overlay
match-mode=fzf
filter-desktop=yes

[colors]
background=050408ee
text=c8c8d0ff
prompt=d8a657ff
placeholder=55515dcc
input=e4e0e8ff
match=d8a657ff
selection=171522ff
selection-text=e4e0e8ff
selection-match=fabd2fff
counter=918999cc
border=55515dcc

[border]
width=1
radius=0
selection-radius=0
